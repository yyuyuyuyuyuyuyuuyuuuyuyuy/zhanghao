<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 저녁메뉴 추천</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #ff4d4d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 111, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff6f00;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }
        #result {
            margin: 30px 0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff3e0;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .emoji {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounce 0.5s ease infinite alternate;
        }
        .food-name {
            font-size: 28px;
            font-weight: 800;
            color: #333;
        }
        button {
            background-color: #ff8f00;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(255, 143, 0, 0.3);
        }
        button:hover {
            background-color: #ff6f00;
            box-shadow: 0 6px 16px rgba(255, 111, 0, 0.4);
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(255, 111, 0, 0.3);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        
        /* 팝업 애니메이션 효과 */
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오늘 뭐 먹지?</h1>
        <p class="subtitle">결정하기 힘들 땐 운명에 맡겨보세요!</p>
        
        <div id="result">
            <div class="emoji" style="animation: none;">🍽️</div>
            <div class="food-name" style="font-size: 20px; color: #888;">버튼을 눌러주세요</div>
        </div>
        
        <button id="recommendBtn">저녁메뉴 추천</button>
    </div>

    <script>
        const menuList = [
            { name: '치킨', emoji: '🍗' },
            { name: '피자', emoji: '🍕' },
            { name: '삼겹살', emoji: '🥓' },
            { name: '짜장면', emoji: '🍜' },
            { name: '햄버거', emoji: '🍔' },
            { name: '떡볶이', emoji: '🥘' },
            { name: '초밥', emoji: '🍣' },
            { name: '국밥', emoji: '🍲' },
            { name: '돈까스', emoji: '🍱' },
            { name: '스테이크', emoji: '🥩' },
            { name: '샐러드', emoji: '🥗' },
            { name: '파스타', emoji: '🍝' },
            { name: '마라탕', emoji: '🌶️' },
            { name: '족발', emoji: '🍖' },
            { name: '김치찌개', emoji: '🍲' },
            { name: '회', emoji: '🐟' },
            { name: '샌드위치', emoji: '🥪' },
            { name: '타코', emoji: '🌮' },
            { name: '카레', emoji: '🍛' }
        ];

        const btn = document.getElementById('recommendBtn');
        const resultDiv = document.getElementById('result');

        btn.addEventListener('click', () => {
            // 초기화 후 애니메이션 다시 적용하기 위한 트릭
            resultDiv.classList.remove('pop-in');
            void resultDiv.offsetWidth; // 리플로우 강제 발생
            
            const randomIndex = Math.floor(Math.random() * menuList.length);
            const selected = menuList[randomIndex];
            
            resultDiv.innerHTML = `
                <div class="emoji">${selected.emoji}</div>
                <div class="food-name">${selected.name}</div>
            `;
            
            resultDiv.classList.add('pop-in');
        });
    </script>
</body>
</html>
